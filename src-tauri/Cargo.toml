[package]
name = "loupe"
version = "0.1.0"
description = "Check a research paper's citations against your own reference documents."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "loupe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "loupe"
path = "src/main.rs"
