<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d0d22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#12112a"/>
      <stop offset="100%" style="stop-color:#0f0e24"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#titleGrad)"/>

  <!-- Header -->
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="url(#titleGrad)">Loupe</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b" letter-spacing="3">OPEN-SOURCE CITATION VERIFIER · RUNS ENTIRELY IN YOUR BROWSER</text>

  <!-- Divider -->
  <line x1="200" y1="88" x2="1000" y2="88" stroke="#1e1e3a" stroke-width="1"/>

  <!-- ─────────────── PANEL 1: INPUT ─────────────── -->
  <rect x="40" y="108" width="290" height="290" rx="14" fill="url(#cardGrad)" stroke="#1e1e3f" stroke-width="1.2"/>
  <text x="185" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">INPUT</text>

  <!-- Paper icon -->
  <rect x="100" y="150" width="80" height="100" rx="7" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1.2"/>
  <rect x="100" y="150" width="80" height="22" rx="7" fill="#1a1040"/>
  <rect x="100" y="162" width="80" height="10" fill="#1a1040"/>
  <text x="140" y="164" text-anchor="middle" font-size="8" fill="#a78bfa" font-weight="600">PAPER</text>
  <rect x="114" y="183" width="52" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="114" y="193" width="46" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="114" y="203" width="52" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="114" y="213" width="36" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="114" y="223" width="52" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="114" y="233" width="44" height="4" rx="2" fill="#1e1e3f"/>

  <!-- Reference stack -->
  <rect x="192" y="160" width="80" height="90" rx="7" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1.2"/>
  <rect x="192" y="160" width="80" height="22" rx="7" fill="#0f1a30"/>
  <rect x="192" y="172" width="80" height="10" fill="#0f1a30"/>
  <text x="232" y="174" text-anchor="middle" font-size="8" fill="#38bdf8" font-weight="600">REFS</text>
  <rect x="206" y="190" width="52" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="206" y="200" width="44" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="206" y="210" width="52" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="206" y="220" width="38" height="4" rx="2" fill="#1e1e3f"/>
  <rect x="206" y="230" width="52" height="4" rx="2" fill="#1e1e3f"/>
  <!-- stack shadow -->
  <rect x="196" y="156" width="80" height="90" rx="7" fill="none" stroke="#1e1e3f" stroke-width="1"/>
  <rect x="200" y="152" width="80" height="90" rx="7" fill="none" stroke="#1e1e3f" stroke-width="1"/>

  <text x="185" y="278" text-anchor="middle" font-size="12" fill="#94a3b8">Research Paper</text>
  <text x="185" y="296" text-anchor="middle" font-size="12" fill="#94a3b8">+ Reference Sources</text>
  <text x="185" y="318" text-anchor="middle" font-size="11" fill="#475569">PDF · text · paste</text>
  <text x="185" y="338" text-anchor="middle" font-size="11" fill="#334155">No upload · No account · No server</text>
  <text x="185" y="375" text-anchor="middle" font-size="11" fill="#2d1a5e">loupe.yasirmo.me</text>

  <!-- Arrow 1 -->
  <line x1="332" y1="253" x2="392" y2="253" stroke="url(#arrowGrad)" stroke-width="2.5"/>
  <polygon points="390,247 403,253 390,259" fill="#8b5cf6"/>

  <!-- ─────────────── PANEL 2: ENGINE ─────────────── -->
  <rect x="403" y="108" width="390" height="290" rx="14" fill="url(#cardGrad)" stroke="#1e1e3f" stroke-width="1.2"/>
  <text x="598" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">LOUPE ENGINE</text>

  <!-- Browser shield badge -->
  <rect x="548" y="148" width="100" height="30" rx="15" fill="#1a1040" stroke="#2d1a5e" stroke-width="1"/>
  <text x="598" y="168" text-anchor="middle" font-size="11" fill="#a78bfa">🔒 In-Browser</text>

  <!-- Step 1 -->
  <rect x="423" y="190" width="350" height="46" rx="9" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <circle cx="450" cy="213" r="13" fill="#1a1040" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">1</text>
  <text x="474" y="208" font-size="12" font-weight="600" fill="#e2e8f0">Extract &amp; Chunk</text>
  <text x="474" y="225" font-size="10" fill="#475569">Parse paper claims · Split references into segments</text>

  <!-- Step 2 -->
  <rect x="423" y="244" width="350" height="46" rx="9" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <circle cx="450" cy="267" r="13" fill="#1a1040" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">2</text>
  <text x="474" y="262" font-size="12" font-weight="600" fill="#e2e8f0">Verify Citations</text>
  <text x="474" y="279" font-size="10" fill="#475569">Match each cited claim to its source · Score support level</text>

  <!-- Step 3 -->
  <rect x="423" y="298" width="350" height="46" rx="9" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <circle cx="450" cy="321" r="13" fill="#1a1040" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">3</text>
  <text x="474" y="316" font-size="12" font-weight="600" fill="#e2e8f0">Detect Contradictions + Uncited Claims</text>
  <text x="474" y="333" font-size="10" fill="#475569">Dedicated pass for conflicts · Flag unsupported assertions</text>

  <text x="598" y="373" text-anchor="middle" font-size="11" fill="#334155">All computation runs locally · Zero data retention</text>

  <!-- Arrow 2 -->
  <line x1="795" y1="253" x2="855" y2="253" stroke="url(#arrowGrad)" stroke-width="2.5"/>
  <polygon points="853,247 866,253 853,259" fill="#8b5cf6"/>

  <!-- ─────────────── PANEL 3: OUTPUT ─────────────── -->
  <rect x="866" y="108" width="290" height="290" rx="14" fill="url(#cardGrad)" stroke="#1e1e3f" stroke-width="1.2"/>
  <text x="1011" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="2">VERDICTS</text>

  <!-- Supported -->
  <rect x="886" y="150" width="250" height="44" rx="8" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <rect x="886" y="150" width="4" height="44" rx="2" fill="#10b981"/>
  <circle cx="910" cy="172" r="10" fill="#10b981" fill-opacity="0.15"/>
  <text x="910" y="177" text-anchor="middle" font-size="12" fill="#10b981">✓</text>
  <text x="928" y="168" font-size="11" font-weight="600" fill="#10b981">Supported</text>
  <text x="928" y="184" font-size="10" fill="#475569">Claim is backed by cited source</text>

  <!-- Partial -->
  <rect x="886" y="202" width="250" height="44" rx="8" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <rect x="886" y="202" width="4" height="44" rx="2" fill="#f59e0b"/>
  <circle cx="910" cy="224" r="10" fill="#f59e0b" fill-opacity="0.15"/>
  <text x="910" y="229" text-anchor="middle" font-size="12" fill="#f59e0b">~</text>
  <text x="928" y="220" font-size="11" font-weight="600" fill="#f59e0b">Partially Supported</text>
  <text x="928" y="236" font-size="10" fill="#475569">Source relates but does not fully confirm</text>

  <!-- Unsupported -->
  <rect x="886" y="254" width="250" height="44" rx="8" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <rect x="886" y="254" width="4" height="44" rx="2" fill="#ef4444"/>
  <circle cx="910" cy="276" r="10" fill="#ef4444" fill-opacity="0.15"/>
  <text x="910" y="281" text-anchor="middle" font-size="12" fill="#ef4444">✗</text>
  <text x="928" y="272" font-size="11" font-weight="600" fill="#ef4444">Unsupported / Contradicted</text>
  <text x="928" y="288" font-size="10" fill="#475569">Claim conflicts with or absent from source</text>

  <!-- Uncited -->
  <rect x="886" y="306" width="250" height="44" rx="8" fill="#0a0a1a" stroke="#1e1e3f" stroke-width="1"/>
  <rect x="886" y="306" width="4" height="44" rx="2" fill="#8b5cf6"/>
  <circle cx="910" cy="328" r="10" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="910" y="333" text-anchor="middle" font-size="12" fill="#8b5cf6">!</text>
  <text x="928" y="324" font-size="11" font-weight="600" fill="#8b5cf6">Uncited Claim Flagged</text>
  <text x="928" y="340" font-size="10" fill="#475569">Assertive claim with no citation found</text>

  <!-- ─────────────── FOOTER ─────────────── -->
  <rect x="40" y="420" width="1120" height="52" rx="10" fill="#0d0d22" stroke="#1e1e3a" stroke-width="1"/>
  <text x="600" y="440" text-anchor="middle" font-size="11" fill="#475569" letter-spacing="1">WHY LOUPE?</text>
  <text x="600" y="460" text-anchor="middle" font-size="12" fill="#64748b">Catch citation errors before peer review  ·  No sign-up, no data collected, runs offline  ·  MIT License  ·  github.com/YasirM0/loupe</text>

</svg>
